<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lineage View — Visual Control Plane</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#090d16] text-gray-100 antialiased h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-80 bg-[#111827] border-r border-slate-800 flex flex-col shrink-0">
    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="activity" class="h-6 w-6 text-sky-400"></i>
        <span class="font-bold text-lg tracking-tight">Lineage View</span>
      </div>
      <span class="text-xs px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 font-mono border border-sky-500/20">PRO v4.5</span>
    </div>

    <!-- Live Telemetry Pulse Badge -->
    <div class="mx-3 mt-3 p-2.5 bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-between text-xs">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span class="text-slate-300 font-medium">Telemetry Pulse</span>
      </div>
      <span id="pulse-timer" class="font-mono text-[10px] text-slate-400">Syncing...</span>
    </div>

    <div class="p-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Projects Workspace</div>
    
    <div id="project-list" class="flex-1 overflow-y-auto p-3 space-y-1.5">
      <!-- Dynamically populated -->
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <header class="px-6 py-4 border-b border-slate-800 bg-[#111827] flex items-center justify-between flex-wrap gap-4">
      <div>
        <h1 id="page-title" class="text-lg font-bold text-slate-100 uppercase tracking-wide">Overview</h1>
        <p class="text-xs text-slate-400">Visual Control Plane & Automated Diagnostic Daemon</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="exportAuditReport()" class="flex items-center gap-1.5 px-3 py-1.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs rounded-lg transition shadow">
          <i data-lucide="download" class="h-3.5 w-3.5"></i> Export Audit Report
        </button>
        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs">
          <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1 rounded font-semibold uppercase bg-sky-500 text-slate-950 transition">All</button>
          <button onclick="setFilter('broken')" id="filter-broken" class="px-3 py-1 rounded font-semibold uppercase text-slate-400 hover:text-slate-200 transition">Broken</button>
          <button onclick="setFilter('gap')" id="filter-gap" class="px-3 py-1 rounded font-semibold uppercase text-slate-400 hover:text-slate-200 transition">Gap</button>
          <button onclick="setFilter('ok')" id="filter-ok" class="px-3 py-1 rounded font-semibold uppercase text-slate-400 hover:text-slate-200 transition">Ok</button>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-6">
      <div id="chains-container" class="max-w-4xl mx-auto space-y-4">
        <!-- Chains dynamically rendered here -->
      </div>
    </div>
  </main>

  <script>
    let overviewData = null;
    let currentProjectId = null;
    let currentFilter = 'all';
    let chainsData = [];
    let explanations = {};

    async function init() {
      await fetchOverview();
      startPulseTimer();
      setInterval(fetchOverview, 15000);
    }

    async function fetchOverview() {
      try {
        const res = await fetch('/api/overview');
        overviewData = await res.json();
        renderProjects();
        if (!currentProjectId && overviewData.projects && overviewData.projects.length > 0) {
          selectProject(overviewData.projects[0].id);
        }
      } catch (err) {
        console.error('Failed to load overview', err);
      }
      lucide.createIcons();
    }

    function startPulseTimer() {
      setInterval(() => {
        const d = new Date();
        document.getElementById('pulse-timer').innerText = d.toLocaleTimeString();
      }, 1000);
    }

    function renderProjects() {
      const container = document.getElementById('project-list');
      if (!overviewData || !overviewData.projects) return;
      container.innerHTML = overviewData.projects.map(p => `
        <button onclick="selectProject('${p.id}')" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${currentProjectId === p.id ? 'bg-sky-500/15 text-sky-400 border border-sky-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}">
          <span class="font-mono">${p.id}</span>
          ${p.brokenCount > 0 ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">${p.brokenCount}</span>` : ''}
        </button>
      `).join('');
    }

    async function selectProject(projectId) {
      currentProjectId = projectId;
      document.getElementById('page-title').innerText = `${projectId} Pipeline`;
      renderProjects();
      try {
        const res = await fetch(`/api/chains?project=${projectId}`);
        const data = await res.json();
        chainsData = data.chains || [];
        renderChains();
      } catch (err) {
        console.error('Failed to load chains', err);
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'broken', 'gap', 'ok'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (btn) {
          btn.className = f === filter ? "px-3 py-1 rounded font-semibold uppercase bg-sky-500 text-slate-950 transition" : "px-3 py-1 rounded font-semibold uppercase text-slate-400 hover:text-slate-200 transition";
        }
      });
      renderChains();
    }

    async function explainIssue(key, kind, message) {
      const cacheKey = `${key}-${kind}`;
      if (explanations[cacheKey]?.data) return;

      explanations[cacheKey] = { loading: true };
      renderChains();

      try {
        const res = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, kind, message })
        });
        const data = await res.json();
        explanations[cacheKey] = { loading: false, data };
      } catch (err) {
        explanations[cacheKey] = { loading: false, error: 'Failed to fetch explanation' };
      }
      renderChains();
    }

    function renderChains() {
      const container = document.getElementById('chains-container');
      const filtered = chainsData.filter(c => currentFilter === 'all' || c.health === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-slate-500 text-sm">No pipeline chains match your filter criteria.</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        return `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div>
                <h3 class="font-semibold text-slate-100 text-sm">${c.title}</h3>
                <span class="text-[11px] text-slate-400 font-mono">Key: ${c.key} • Date: ${c.date}</span>
              </div>
              <span class="px-2.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border ${
                c.health === 'broken' ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' :
                c.health === 'gap' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' :
                'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'
              }">${c.health}</span>
            </div>

            <!-- Nodes interactive strip -->
            <div class="flex items-center gap-2 bg-slate-950/70 p-3 rounded-lg border border-slate-800 text-xs overflow-x-auto">
              ${Object.entries(c.nodes).map(([nodeName, nodeInfo]) => `
                <div class="px-3 py-1.5 rounded-md border flex items-center gap-1.5 font-medium uppercase tracking-wide shrink-0 ${
                  nodeInfo.state === 'ok' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' :
                  nodeInfo.state === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-slate-950 border-slate-800 text-slate-500'
                }">
                  <i data-lucide="${nodeInfo.state === 'ok' ? 'check-circle-2' : nodeInfo.state === 'error' ? 'x-circle' : 'minus-circle'}" class="h-3.5 w-3.5"></i>
                  ${nodeName} (${nodeInfo.state})
                </div>
              `).join('')}
            </div>

            <!-- Issues & AI Diagnosis Trigger -->
            ${c.issues ? c.issues.map(i => {
              const cacheKey = `${c.key}-${i.kind}`;
              const exp = explanations[cacheKey];

              return `
                <div class="bg-rose-950/20 border border-rose-500/30 rounded-lg p-4 text-xs space-y-3">
                  <div class="flex items-center justify-between flex-wrap gap-2">
                    <span class="font-semibold text-rose-300 flex items-center gap-2">
                      <i data-lucide="shield-alert" class="h-4 w-4 text-rose-400 shrink-0"></i>
                      [${i.severity.toUpperCase()}]${i.message}
                    </span>
                    <button onclick="explainIssue('${c.key}', '${i.kind}', '${i.message}')" 
                      class="px-3.5 py-1.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-lg transition shadow">
                      ${exp?.loading ? 'Analyzing with AI...' : '✨ Explain with AI'}
                    </button>
                  </div>

                  ${exp?.data ? `
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-lg space-y-3 text-slate-300 mt-2">
                      <div class="font-bold text-sky-400 flex items-center gap-2 border-b border-slate-800 pb-2">
                        <i data-lucide="cpu" class="h-4 w-4"></i> Automated AI Diagnostic Report (${exp.data.source})
                      </div>
                      
                      <!-- What Happened Section -->
                      <div class="space-y-1 bg-slate-900/60 p-3 rounded border border-slate-800/80">
                        <div class="font-semibold text-rose-400 flex items-center gap-1.5 uppercase tracking-wider text-[10px]">
                          <i data-lucide="alert-triangle" class="h-3.5 w-3.5"></i> What Happened
                        </div>
                        <p class="text-slate-200 text-xs"><strong>Incident:</strong> ${exp.data.what}</p>
                        <p class="text-slate-400 text-xs"><strong>Root Cause:</strong> ${exp.data.likelyCause}</p>
                      </div>

                      <!-- How to Fix It Section -->
                      <div class="space-y-1 bg-emerald-950/20 p-3 rounded border border-emerald-500/20">
                        <div class="font-semibold text-emerald-400 flex items-center gap-1.5 uppercase tracking-wider text-[10px]">
                          <i data-lucide="wrench" class="h-3.5 w-3.5"></i> How to Fix It
                        </div>
                        <p class="text-slate-300 text-xs"><strong>Assigned Owner:</strong> <span class="font-mono text-emerald-300">${exp.data.owner}</span></p>
                        <div class="text-slate-300 text-xs mt-1">
                          <strong>Remediation Steps:</strong>
                          <ul class="list-disc pl-4 mt-1 space-y-0.5 text-slate-300">
                            ${exp.data.fixSteps.map(step => `<li>${step}</li>`).join('')}
                          </ul>
                        </div>
                      </div>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('') : ''}
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function exportAuditReport() {
      const report = {
        timestamp: new Date().toISOString(),
        project: currentProjectId,
        fleetOverview: overviewData,
        chains: chainsData
      };
      const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lineage-audit-${currentProjectId || 'fleet'}-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
